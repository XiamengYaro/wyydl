name: Release

on:
  push:
    tags: ["v*"]          # 推送 v* 标签 → 测试 + 打包 fpk + 构建镜像 + 发布 Release
  workflow_dispatch:       # 也允许手动触发(仅测试+打包,不发布)

permissions:
  contents: write
  packages: write          # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像名(小写)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/wyydl-sync" >> "$GITHUB_ENV"

      - name: 安装 fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack

      - name: 校验标签与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(grep -E '^version' fpk/manifest | head -1 | awk -F= '{print $2}' | tr -d ' ')
          echo "tag=$TAG manifest=$MANIFEST_VERSION"
          echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "错误:标签 $TAG 不是合法语义化版本(SemVer)"; exit 1; }
          [ "$TAG" = "$MANIFEST_VERSION" ] || { echo "错误:标签 v$TAG 与 manifest 版本 $MANIFEST_VERSION 不一致"; exit 1; }

      - name: 运行冒烟测试
        run: |
          cd sync
          pip install -r requirements.txt
          python -m tests.smoke

      - name: 打包 fpk
        run: ./fpk/build.sh

      - name: 准备 Buildx(多架构容器驱动)
        uses: docker/setup-buildx-action@v3

      - name: 准备 QEMU(arm64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: 构建并推送 Docker 镜像(GHCR,多架构)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: ./sync
          file: ./sync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: 验证 GHCR 镜像可匿名拉取
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_NAME="${GITHUB_REPOSITORY#*/}/wyydl-sync"
          TOKEN=$(curl -sSL \
            "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}/wyydl-sync:pull" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error title=GHCR token unavailable::无法获取匿名 pull token"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/ghcr-manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/wyydl-sync/manifests/${GITHUB_REF_NAME}")
          if [ "$CODE" != "200" ]; then
            echo "::error title=GHCR package is private::${GITHUB_REF_NAME} 无法匿名拉取（HTTP $CODE）。请在 GitHub Package settings 中把 ${PACKAGE_NAME} 改为 Public。"
            echo "设置地址: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${PACKAGE_NAME//\//%2F}/settings"
            cat /tmp/ghcr-manifest.json
            exit 1
          fi
          echo "GHCR 匿名拉取验证通过: ${IMAGE}:${GITHUB_REF_NAME}"

      - name: 打包本地构建回退版 fpk
        run: WYYDL_BUILD_MODE=local ./fpk/build.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wyydl-fpk
          path: |
            fpk/wyydl.fpk
            fpk/wyydl-*-local.fpk

      - name: 创建 Release 并上传 fpk
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fpk/wyydl.fpk fpk/wyydl-*-local.fpk \
            --title "$GITHUB_REF_NAME" --generate-notes

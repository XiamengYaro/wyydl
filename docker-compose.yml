# 网易云歌单同步 - 通用 Docker 部署
# 用法:docker compose up -d --build
# 说明:wyydl-sync 可二选一 ——
#   1) 拉取预构建镜像(推荐):保留下面 image: 行,注释掉 build: 行;
#   2) 本地构建镜像:注释掉 image: 行,保留 build: 行(需联网 pypi)。
services:
  ncm-api:
    image: moefurina/ncm-api:latest
    container_name: ncm-api
    restart: unless-stopped
    environment:
      # 容器内 request 库会读这些代理变量,必须显式清空,否则全部请求失败(官方 README 要求)
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: ""
      NO_PROXY: ""
      ENABLE_FLAC: "true"
      SELECT_MAX_BR: "true"
      ENABLE_GENERAL_UNBLOCK: "true"
    ports:
      - "127.0.0.1:3000:3000"   # 仅本机/SSH 隧道可访问,不暴露局域网
    networks: [wyydl]

  # 可选:QQ 音乐 API(QQ 功能需要;网络不佳时可注释掉本服务)
  # 镜像源用法:在旁侧 .env 写 WYYDL_QQ_IMAGE=ghcr.nju.edu.cn/xiamengyaro/qq-music-api:v1.12.0
  qq-music-api:
    image: ${WYYDL_QQ_IMAGE:-ghcr.io/xiamengyaro/qq-music-api:v1.12.0}
    container_name: qq-music-api
    restart: unless-stopped
    environment:
      - PORT=3300
    expose:
      - "3300"
    networks: [wyydl]

  # 镜像源用法:.env 写 WYYDL_SYNC_IMAGE=<镜像源>/ghcr.io/xiamengyaro/wyydl-sync:latest
  wyydl-sync:
    image: ${WYYDL_SYNC_IMAGE:-ghcr.io/xiamengyaro/wyydl-sync:latest}
    build: ./sync              # 二选一:用预构建镜像时注释此行
    container_name: wyydl-sync
    restart: unless-stopped
    depends_on: [ncm-api, qq-music-api]
    environment:
      - TZ=Asia/Shanghai
      - NCM_API=http://ncm-api:3000
      - QQ_API=http://qq-music-api:3300
    ports:
      - "8286:8286"             # Web 控制面板
    volumes:
      - ./config:/config
      - ./db:/db
      - ./logs:/logs
      - ./music:/music
    networks: [wyydl]

networks:
  wyydl:
